spring:
  flyway:
    enabled: false
  session:
    timeout: 1h
    jdbc:
      initialize-schema: embedded
  application:
    name: PassMate
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
  
  datasource:
    url: jdbc:h2:file:./data/passmate;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  
  h2:
    console:
      enabled: true

server:
  port: 8080
  servlet:
    context-path: /api
    session:
      cookie:
        name: PM_SESSION
        http-only: true
        same-site: lax

logging:
  level:
    root: INFO
    com.passmate: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} %clr(%-5level) %clr([%15.15thread]){faint} %clr(%-36.36logger{36}){cyan} : %msg%n"
